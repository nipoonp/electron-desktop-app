name: Tabin CI/CD NEW

on:
    push:
        branches: [main]

permissions:
    contents: write

jobs:
    slack_message_start:
        runs-on: ubuntu-latest
        steps:
            - name: Post to a Slack channel
              id: slack
              uses: slackapi/slack-github-action@v1.23.0
              with:
                  channel-id: ${{ secrets.SLACK_BOT_CHANNEL_ID }}
                  slack-message: "Electron build started!"
              env:
                  SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    create_release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3.3.0
            - name: get-npm-version
              id: package-version
              uses: martinbeentjes/npm-get-version-action@master
            - name: Create draft release if needed
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
                  TAG: v${{ steps.package-version.outputs.current-version }}
              run: |
                  gh release view "$TAG" > /dev/null 2>&1 ||
                      gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --notes "Desktop release"
    windows:
        needs: create_release
        runs-on: windows-latest
        env:
            CI: false #Need this otherwise github actions will do this => "Treating warnings as errors because process.env.CI = true"
        steps:
            - uses: actions/checkout@v3.3.0
            - uses: actions/setup-node@v4
              with:
                  node-version: "26.12.1"
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
            - name: Install dependencies
              run: npm ci --legacy-peer-deps
            - name: Build web
              run: npm run build:web
            - name: Build desktop
              run: npm run build:desktop
            - name: Release Electron app
              run: >-
                  npm run release:windows --
                  --config.publish.owner=${{ github.repository_owner }}
                  --config.publish.repo=${{ github.event.repository.name }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
    macos:
        needs: create_release
        runs-on: macos-15
        env:
            CI: false
        steps:
            - uses: actions/checkout@v3.3.0
            - uses: actions/setup-node@v4
              with:
                  node-version: "26.12.1"
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
            - name: Install dependencies
              run: npm ci --legacy-peer-deps
            - name: Build web
              run: npm run build:web
            - name: Build desktop
              run: npm run build:desktop
            - name: Release Electron app
              run: >-
                  npm run release:macos -- --x64 --arm64
                  --config.publish.owner=${{ github.repository_owner }}
                  --config.publish.repo=${{ github.event.repository.name }}
                  --config.mac.identity=-
                  --config.mac.hardenedRuntime=false
                  --config.mac.notarize=false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    slack_message_complete:
        needs: [slack_message_start, create_release, windows, macos]
        runs-on: ubuntu-latest
        steps:
            - name: Post to a Slack channel
              id: slack
              uses: slackapi/slack-github-action@v1.23.0
              with:
                  channel-id: ${{ secrets.SLACK_BOT_CHANNEL_ID }}
                  slack-message: "Electron build completed! 🚀🚀🔥"
              env:
                  SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
